name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: tools/flarum2-ops
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y php-sqlite3
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/flarum2-ops/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          FLARUM2_OPS_REQUIRE_PDO_SQLITE: "1"
      - run: php -l helpers/settings_read.php
      - run: python3 -B -c "import sys; compile(open('helpers/screenshot.py', encoding='utf-8').read(), 'screenshot.py', 'exec')"
      - run: for f in run-mcp.sh ../../skills/flarum2-design-ops/scripts/*.sh; do bash -n "$f" && echo "ok $f"; done
  skill:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.3
      - run: python -B tools/validate.py
